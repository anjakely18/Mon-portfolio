backend:
  name: git-gateway
  branch: main


media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  # ─── Projets ────────────────────────────────────────────────────────────
  - name: "projects"
    label: "Projets"
    files:
      - name: "projects"
        label: "Liste des projets"
        file: "src/content/projects.json"
        fields:
          - name: projects
            label: Projets
            widget: list
            fields:
              - { name: slug,     label: "Slug (URL)",       widget: string }
              - { name: title,    label: Titre,              widget: string }
              - name: category
                label: Catégorie
                widget: select
                options: ["Développement", "Design", "Jeu"]
              - { name: role,     label: Rôle,               widget: string }
              - { name: duration, label: Durée,              widget: string }
              - { name: text,     label: Description courte, widget: text }
              - { name: context,  label: Contexte,           widget: text }
              - { name: approach, label: Approche,           widget: text }
              - { name: result,   label: Résultat,           widget: text }
              - { name: url,      label: URL du projet,      widget: string, required: false }
              - { name: github,   label: URL GitHub,         widget: string, required: false }
              - name: techs
                label: Technologies
                widget: list
                field: { name: tech, label: Technologie, widget: string }
              - name: gallery
                label: Galerie
                widget: list
                field: { name: image, label: Image, widget: image }

  # ─── Compétences ────────────────────────────────────────────────────────────
  - name: "skills"
    label: "Compétences"
    files:
      - name: "skills"
        label: "Liste des compétences"
        file: "src/content/skills.json"
        fields:
          - name: skills
            label: Compétences
            widget: list
            fields:
              - { name: title,   label: Titre,              widget: string }
              - name: icon
                label: Icône
                widget: select
                options: [code, react, figma, php, checkDouble, lightbulb, search, users, briefcase, graduationCap, calendarCheck, campaign]
              - { name: summary, label: Résumé (1 phrase),  widget: string }
              - { name: text,    label: Description,        widget: text }
              - name: techs
                label: Technologies
                widget: list
                field: { name: tech, label: Technologie, widget: string }

  # ─── Formations ─────────────────────────────────────────────────────────────
  - name: "formations"
    label: "Formations"
    files:
      - name: "formations"
        label: "Liste des formations"
        file: "src/content/formations.json"
        fields:
          - name: formations
            label: Formations
            widget: list
            fields:
              - { name: date,         label: Période,       widget: string }
              - { name: title,        label: Intitulé,      widget: string }
              - { name: organisation, label: Établissement, widget: string }
              - { name: description,  label: Description,   widget: text }

  # ─── Expériences ────────────────────────────────────────────────────────────
  - name: "experiences"
    label: "Expériences"
    files:
      - name: "experiences"
        label: "Liste des expériences"
        file: "src/content/experiences.json"
        fields:
          - name: experiences
            label: Expériences
            widget: list
            fields:
              - { name: date,         label: Période,    widget: string }
              - { name: title,        label: Poste,      widget: string }
              - { name: organisation, label: Entreprise, widget: string }
              - { name: description,  label: Description, widget: text }

  # ─── Certifications ─────────────────────────────────────────────────────────
  - name: "certifications"
    label: "Certifications"
    files:
      - name: "certifications"
        label: "Liste des certifications"
        file: "src/content/certifications.json"
        fields:
          - name: certifications
            label: Certifications
            widget: list
            fields:
              - { name: title,  label: Titre,       widget: string }
              - { name: issuer, label: Organisme,   widget: string }
              - { name: date,   label: Date,        widget: string }
              - { name: text,   label: Description, widget: text }
              - { name: img,    label: Image,       widget: image, required: false }

  # ─── Profil ─────────────────────────────────────────────────────────────────
  - name: "profilData"
    label: "Profil"
    files:
      - name: "profilData"
        label: "Données du profil"
        file: "src/content/profilData.json"
        fields:
          - { name: histoire, label: "Mon histoire", widget: text }
          - name: langues
            label: Langues
            widget: list
            fields:
              - { name: code,  label: "Code pays (ex: FR)", widget: string }
              - { name: name,  label: Nom,                  widget: string }
              - { name: level, label: Niveau,               widget: string }
          - name: valeurs
            label: Valeurs
            widget: list
            fields:
              - name: icon
                label: Icône
                widget: select
                options: [checkDouble, lightbulb, search, users, briefcase, graduationCap, calendarCheck, campaign, code, react, figma, php]
              - { name: title,       label: Titre,       widget: string }
              - { name: description, label: Description, widget: text }
          - name: interets
            label: "Centres d'intérêt"
            widget: list
            field: { name: interet, label: "Centre d'intérêt", widget: string }

  # ─── À propos (home) ────────────────────────────────────────────────────────
  - name: "aboutInfo"
    label: "À propos (accueil)"
    files:
      - name: "aboutInfo"
        label: "Infos à propos"
        file: "src/content/aboutInfo.json"
        fields:
          - { name: bio,          label: Bio,           widget: text }
          - { name: localisation, label: Localisation,  widget: string }
          - name: cards
            label: Cartes
            widget: list
            fields:
              - name: icon
                label: Icône
                widget: select
                options: [briefcase, graduationCap, calendarCheck, checkDouble, lightbulb, search, users, campaign, code, react, figma, php]
              - { name: title,       label: Titre,       widget: string }
              - { name: description, label: Description, widget: text }
